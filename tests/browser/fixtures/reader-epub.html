<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synthetic Reader EPUB load surface</title>
    <style>
      body {
        margin: 0;
      }
      #publication {
        width: 1050px;
        height: 750px;
      }
      #publication[data-visible-scrollbar] .epub-container::-webkit-scrollbar {
        width: 16px;
      }
      #publication[data-visible-scrollbar] .epub-container::-webkit-scrollbar-thumb {
        background: #777;
      }
      #publication[data-visible-scrollbar] .epub-container::-webkit-scrollbar-track {
        background: #eee;
      }
    </style>
  </head>
  <body>
    <div id="publication"></div>
    <p id="status" role="status">Loading synthetic EPUB</p>
    <script type="module" src="./reader-epub-main.ts"></script>
  </body>
</html>
