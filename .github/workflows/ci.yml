name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend-static:
    name: Frontend static checks
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check architecture
        run: npm run architecture:check

      - name: Check Tauri command parity
        run: npm run ipc:check

      - name: Check settings mutation contract
        run: npm run settings:contract:check

      - name: Check static documentation navigation
        run: npm run docs:check

      - name: Check formatting
        run: npm run fmt

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

  frontend-tests:
    name: Frontend tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

  browser-contracts:
    name: Browser accessibility and layout contracts (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium headless shell
        run: npx playwright install --with-deps chromium --only-shell

      - name: Run browser contracts
        timeout-minutes: 15
        run: npm run test:browser -- --shard=${{ matrix.shard }}/2

      - name: Upload browser failure evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-contract-failure-${{ matrix.shard }}
          path: |
            test-results/browser/
            test-results/async-surfaces/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build async surface fixtures
        if: matrix.shard == 1
        run: npx vite build --config tests/browser/async-surfaces-build.config.ts

      - name: Run built async surface contracts
        if: matrix.shard == 1
        run: npx playwright test --config tests/browser/async-surfaces.config.ts

      - name: Upload async surface failure evidence
        if: ${{ failure() && !cancelled() && matrix.shard == 1 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: async-surface-contract-failure
          path: test-results/async-surfaces/
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Frontend build and assets
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify bundled frontend assets
        run: npm run test:inter-assets

  release-tooling:
    name: Release tooling checks
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.97.1

      - name: Install dependencies
        run: npm ci

      - name: Run release tooling tests
        run: npm run test -- tests/releaseTooling.test.ts tests/releaseCandidate.test.ts tests/releasePublication.test.ts

  rust-checks:
    name: Rust ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clippy
            command: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          - name: Tests
            command: cargo test --locked --manifest-path src-tauri/Cargo.toml

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Check Rust formatting
        if: matrix.name == 'Clippy'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  windows-runtime:
    name: Windows Tauri runtime smoke
    runs-on: windows-2022
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Install Tauri WebDriver bridge
        run: cargo install tauri-driver --version 2.0.6 --locked --root .scratch/runtime-smoke-tools

      - name: Run real Windows runtime smoke
        run: npm run test:runtime:windows

      - name: Upload runtime failure evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-runtime-smoke-failure
          path: test-results/runtime-smoke/
          if-no-files-found: ignore
          retention-days: 7

  windows-updater:
    name: Windows installed updater smoke
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Install Tauri WebDriver bridge
        run: cargo install tauri-driver --version 2.0.6 --locked --root .scratch/runtime-smoke-tools

      - name: Verify isolated signed NSIS and MSI updates
        run: npm run test:updater:windows

      - name: Upload updater evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-updater-smoke
          path: test-results/updater-smoke/
          if-no-files-found: ignore
          retention-days: 7

  font-catalog-portability:
    name: Linux font catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.97.1
      - name: Compile and test the non-Windows catalog without Windows dependencies
        run: |
          mkdir -p .scratch
          rustc --edition=2021 --test src-tauri/src/commands/font_catalog.rs -o .scratch/font-catalog-tests
          .scratch/font-catalog-tests

  msrv:
    name: Rust 1.90 check
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust 1.90
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.90.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            src-tauri -> target
          shared-key: msrv-1.90

      - name: Check minimum Rust version
        run: cargo +1.90.0 check --locked --all-targets --manifest-path src-tauri/Cargo.toml

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - frontend-static
      - frontend-tests
      - browser-contracts
      - frontend-build
      - release-tooling
      - rust-checks
      - font-catalog-portability
      - windows-runtime
      - windows-updater
      - msrv
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every validation job to succeed
        shell: pwsh
        env:
          REQUIRED_JOBS: ${{ toJSON(needs) }}
        run: |
          $ErrorActionPreference = 'Stop'
          $jobs = $env:REQUIRED_JOBS | ConvertFrom-Json -AsHashtable
          if ($jobs.Count -eq 0) { throw 'CI Gate has no validation jobs.' }

          $failed = $false
          foreach ($job in $jobs.GetEnumerator()) {
            $result = $job.Value['result']
            Write-Host "$($job.Key): $result"
            if ($result -ne 'success') { $failed = $true }
          }

          if ($failed) { throw 'A required CI validation job did not succeed.' }
