name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TAURI_DRIVER_VERSION: 2.0.6

jobs:
  classify-changes:
    name: Classify validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      expected_jobs: ${{ steps.classify.outputs.expected_jobs }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
      - name: Classify exact event revisions
        id: classify
        run: node scripts/ci-validation-policy.mjs classify

  frontend-static:
    name: Frontend static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --filter archeion... --frozen-lockfile

      - name: Check built-in palette outputs
        run: pnpm run themes:check

      - name: Check architecture
        run: pnpm run architecture:check

      - name: Check Tauri command parity
        run: pnpm run ipc:check

      - name: Check settings mutation contract
        run: pnpm run settings:contract:check

      - name: Check static documentation navigation
        run: pnpm run docs:check

      - name: Check formatting
        run: pnpm run fmt

      - name: Lint frontend
        run: pnpm run lint

      - name: Typecheck frontend
        run: pnpm run typecheck

      - name: Typecheck browser contracts
        run: pnpm run test:browser:typecheck

  frontend-tests:
    name: Frontend tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --filter archeion... --frozen-lockfile

      - name: Record test environment
        run: node -p "JSON.stringify({node:process.version,os:require('node:os').version(),runnerImage:process.env.ImageVersion})"

      - name: Run frontend tests
        run: pnpm run test

  browser-contracts:
    name: Browser accessibility and layout contracts (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --filter archeion... --frozen-lockfile

      - name: Record test environment
        run: node -p "JSON.stringify({node:process.version,os:require('node:os').version(),runnerImage:process.env.ImageVersion})"

      - name: Record Playwright version
        run: pnpm exec playwright --version

      - name: Install Chromium headless shell
        run: pnpm exec playwright install --with-deps chromium --only-shell

      - name: Run browser contracts
        timeout-minutes: 15
        run: pnpm exec playwright test --fail-on-flaky-tests --shard=${{ matrix.shard }}/2

      - name: Upload browser failure evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-contract-failure-${{ matrix.shard }}
          path: |
            test-results/browser/
            test-results/async-surfaces/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build async surface fixtures
        if: matrix.shard == 1
        run: pnpm exec vite build --config tests/browser/async-surfaces-build.config.ts

      - name: Run built async surface contracts
        if: matrix.shard == 1
        run: pnpm exec playwright test --config tests/browser/async-surfaces.config.ts --fail-on-flaky-tests

      - name: Upload async surface failure evidence
        if: ${{ failure() && !cancelled() && matrix.shard == 1 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: async-surface-contract-failure
          path: test-results/async-surfaces/
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Frontend build and assets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --filter archeion... --frozen-lockfile

      - name: Build frontend
        run: pnpm exec vite build

      - name: Verify bundled frontend assets
        run: pnpm run test:inter-assets

  website-build:
    name: Website typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --filter @archeion/website... --frozen-lockfile

      - name: Test website tooling
        run: pnpm --filter @archeion/website test

      - name: Typecheck website
        run: pnpm --filter @archeion/website typecheck

      - name: Build website
        run: pnpm --filter @archeion/website build

  rust-checks:
    needs: classify-changes
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.classify-changes.result != 'success' || needs.classify-changes.outputs.mode != 'docs-only' || needs.classify-changes.outputs.expected_jobs != '["frontend-static","frontend-tests","browser-contracts","frontend-build","website-build"]') }}
    name: Rust ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clippy
            command: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          - name: Tests
            command: cargo test --locked --manifest-path src-tauri/Cargo.toml

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Check Rust formatting
        if: matrix.name == 'Clippy'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Record Rust environment
        run: rustc --version --verbose

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  windows-runtime:
    needs: classify-changes
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.classify-changes.result != 'success' || needs.classify-changes.outputs.mode != 'docs-only' || needs.classify-changes.outputs.expected_jobs != '["frontend-static","frontend-tests","browser-contracts","frontend-build","website-build"]') }}
    name: Windows Tauri runtime smoke
    runs-on: windows-2022
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies
        run: pnpm install --filter archeion... --frozen-lockfile

      - name: Record test environment
        run: node -p "JSON.stringify({node:process.version,os:require('node:os').version(),runnerImage:process.env.ImageVersion})"

      - name: Cache Tauri WebDriver bridge
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .scratch/runtime-smoke-tools
          key: tauri-driver-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ env.TAURI_DRIVER_VERSION }}

      - name: Verify or install Tauri WebDriver bridge
        run: node scripts/ensure-tauri-driver.mjs

      - name: Run real Windows runtime smoke
        run: pnpm run test:runtime:windows

      - name: Upload runtime failure evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-runtime-smoke-failure
          path: test-results/runtime-smoke/
          if-no-files-found: ignore
          retention-days: 7

  windows-updater:
    needs: classify-changes
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.classify-changes.result != 'success' || needs.classify-changes.outputs.mode != 'docs-only' || needs.classify-changes.outputs.expected_jobs != '["frontend-static","frontend-tests","browser-contracts","frontend-build","website-build"]') }}
    name: Windows installed updater smoke
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies
        run: pnpm install --filter archeion... --frozen-lockfile

      - name: Record test environment
        run: node -p "JSON.stringify({node:process.version,os:require('node:os').version(),runnerImage:process.env.ImageVersion})"

      - name: Cache Tauri WebDriver bridge
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .scratch/runtime-smoke-tools
          key: tauri-driver-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ env.TAURI_DRIVER_VERSION }}

      - name: Verify or install Tauri WebDriver bridge
        run: node scripts/ensure-tauri-driver.mjs

      - name: Verify isolated signed NSIS and MSI updates
        run: pnpm run test:updater:windows

      - name: Upload updater evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-updater-smoke
          path: test-results/updater-smoke/
          if-no-files-found: ignore
          retention-days: 7

  font-catalog-portability:
    needs: classify-changes
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.classify-changes.result != 'success' || needs.classify-changes.outputs.mode != 'docs-only' || needs.classify-changes.outputs.expected_jobs != '["frontend-static","frontend-tests","browser-contracts","frontend-build","website-build"]') }}
    name: Linux font catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Compile and test the non-Windows catalog without Windows dependencies
        run: |
          rustc --version --verbose
          uname -a
          mkdir -p .scratch
          rustc --edition=2021 --test src-tauri/src/commands/font_catalog.rs -o .scratch/font-catalog-tests
          .scratch/font-catalog-tests

  msrv:
    needs: classify-changes
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.classify-changes.result != 'success' || needs.classify-changes.outputs.mode != 'docs-only' || needs.classify-changes.outputs.expected_jobs != '["frontend-static","frontend-tests","browser-contracts","frontend-build","website-build"]') }}
    name: Rust 1.90 check
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust 1.90
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.90.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: |
            src-tauri -> target
          shared-key: msrv-1.90

      - name: Check minimum Rust version
        run: cargo +1.90.0 check --locked --all-targets --manifest-path src-tauri/Cargo.toml

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - classify-changes
      - frontend-static
      - frontend-tests
      - browser-contracts
      - frontend-build
      - website-build
      - rust-checks
      - font-catalog-portability
      - windows-runtime
      - windows-updater
      - msrv
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
      - name: Require the classified validation jobs to succeed
        env:
          REQUIRED_JOBS: ${{ toJSON(needs) }}
        run: node scripts/ci-validation-policy.mjs gate
