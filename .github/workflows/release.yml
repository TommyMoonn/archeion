name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        shell: pwsh
        run: >-
          ./scripts/check-release.ps1
          -Tag "${{ github.ref_name }}"
          -RequireChangelogEntry

      - name: Run release checks
        run: npm run verify

      - name: Build NSIS and MSI installers
        run: npm run tauri:build:windows -- --ci --target x86_64-pc-windows-msvc

      - name: Stage installers and checksums
        shell: pwsh
        run: >-
          ./scripts/stage-windows-bundles.ps1
          -BundleRoot ./src-tauri/target/x86_64-pc-windows-msvc/release/bundle

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archeion-${{ github.ref_name }}-windows-x64
          path: artifacts/windows
          if-no-files-found: error
          retention-days: 7

  create-draft-release:
    name: Create draft GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: archeion-${{ github.ref_name }}-windows-x64
          path: artifacts/windows

      - name: Verify release asset checksums
        shell: bash
        working-directory: artifacts/windows
        run: sha256sum --check SHA256SUMS.txt

      - name: Create or refresh draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          title="Archeion ${tag}"
          mapfile -t assets < <(find artifacts/windows -maxdepth 1 -type f -print | sort)

          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if release_state=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$release_state" != "true" ]]; then
              echo "Release $tag is already published; refusing to replace its assets." >&2
              exit 1
            fi

            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --verify-tag \
              --draft \
              --title "$title" \
              --notes ""
          fi
