name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Install website dependencies
        run: pnpm install --filter @archeion/website... --frozen-lockfile
      - name: Check documentation sources and release history
        run: pnpm run docs:check
      - name: Test website tooling
        run: pnpm --filter @archeion/website test
      - name: Typecheck website
        run: pnpm --filter @archeion/website typecheck
      - name: Build website and validate MDX links
        run: pnpm --filter @archeion/website build
      - name: Validate Pages artifact
        run: node scripts/check-website-build.mjs
      - name: Upload only website output
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
