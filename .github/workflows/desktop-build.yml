name: Windows installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installers-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64 installers
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run verify

      - name: Build NSIS and MSI installers
        run: npm run tauri:build:windows -- --ci --target x86_64-pc-windows-msvc

      - name: Read app version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Stage installers and checksums
        shell: pwsh
        run: >-
          ./scripts/stage-windows-bundles.ps1
          -BundleRoot ./src-tauri/target/x86_64-pc-windows-msvc/release/bundle

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: archeion-${{ env.APP_VERSION }}-windows-x64
          path: |
            artifacts/windows/*.exe
            artifacts/windows/*.msi
            artifacts/windows/SHA256SUMS.txt
          if-no-files-found: error
