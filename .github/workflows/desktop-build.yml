name: Windows installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installers-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64 installers
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run pre-build checks
        run: npm run check:all

      - name: Build NSIS and MSI installers
        run: npm run tauri:build:windows -- --ci --target x86_64-pc-windows-msvc

      - name: Verify bundled frontend assets
        run: npm run test:inter-assets

      - name: Read app version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Stage installers and checksums
        shell: pwsh
        run: >-
          ./scripts/stage-windows-bundles.ps1
          -BundleRoot ./src-tauri/target/x86_64-pc-windows-msvc/release/bundle
          --installers-only

      - name: Verify staged installers and checksums
        shell: pwsh
        run: ./scripts/verify-windows-release.ps1 --artifacts-dir artifacts/windows --installers-only

      - name: Smoke test staged NSIS installer
        shell: pwsh
        run: ./scripts/smoke-windows-installer.ps1 --installer artifacts/windows/Archeion-Setup-x64.exe

      - name: Upload Windows installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archeion-${{ env.APP_VERSION }}-windows-x64
          path: |
            artifacts/windows/*.exe
            artifacts/windows/*.msi
            artifacts/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
