[package]
name = "archeion"
version = "1.3.0"
description = "A local-first desktop EPUB reader and archive manager"
authors = ["Khoa Luong"]
license = "GPL-3.0-only"
homepage = "https://tommymoonn.github.io/archeion/"
repository = "https://github.com/TommyMoonn/archeion"
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "archeion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
liblzma = { version = "0.4.7", default-features = false, features = ["static"] }
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
percent-encoding = "2"
quick-xml = "0.41"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
notify = "8.2"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.7.0"
tokio = { version = "1.52", features = ["fs", "io-util", "macros", "rt", "sync"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }
